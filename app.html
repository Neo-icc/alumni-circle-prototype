<style>
:root{
  --green:#07C160; --green-d:#06a552;
  --ink:#191919; --ink2:#4a4a4a; --ink3:#8c8c8c; --line:#ededed; --bg:#f2f2f4; --card:#fff;
  --parent:#F08A3C; --alum:#07C160; --staff:#3A6FF7; --admin:#6B5BD2;
  --danger:#E64340; --warn:#FF9F0A; --ok:#07C160;
  --theme:var(--alum);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","WenQuanYi Micro Hei",sans-serif;
  background:#d9dce3;color:var(--ink);font-size:15px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;min-height:100%;
}
#phone{
  width:390px;height:844px;max-height:100vh;background:var(--bg);position:relative;overflow:hidden;
  border-radius:44px;box-shadow:0 24px 70px rgba(0,0,0,.32);border:8px solid #1c1c1e;
  display:flex;flex-direction:column;
}
@media (max-width:430px){
  body{display:block}
  #phone{width:100vw;height:100vh;border-radius:0;border:none;box-shadow:none;max-height:none}
}
/* ---------- 状态栏 / 导航栏 ---------- */
#statusbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:600;color:#fff;background:var(--theme);transition:background .25s}
#navbar{height:44px;flex:0 0 44px;background:var(--theme);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:17px;font-weight:600;transition:background .25s}
#navbar .back{position:absolute;left:12px;top:0;height:44px;display:flex;align-items:center;font-size:22px;opacity:.95;cursor:pointer}
#navbar .act{position:absolute;right:14px;top:0;height:44px;display:flex;align-items:center;font-size:13px;font-weight:400;opacity:.95;cursor:pointer}
/* ---------- 页面容器 ---------- */
#page{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);padding-bottom:8px}
#tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:#fafafa;padding-bottom:var(--safe-b)}
#tabbar.hidden{display:none}
.tab{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#9a9a9a;cursor:pointer}
.tab.on{color:var(--theme);font-weight:600}
.tab .ico{font-size:20px;line-height:20px}
/* ---------- 组件 ---------- */
.card{background:var(--card);border-radius:12px;margin:10px 12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card.tight{margin:8px 12px;padding:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-title{font-size:13px;color:var(--ink3);margin:14px 12px 6px;display:flex;justify-content:space-between;align-items:center}
.sec-title b{color:var(--ink);font-size:14px;font-weight:600}
.muted{color:var(--ink3);font-size:12px}
.small{font-size:12px}
.b{font-weight:600}
.center{text-align:center}
.btn{display:block;width:100%;height:44px;line-height:44px;text-align:center;border-radius:8px;background:var(--theme);color:#fff;font-size:16px;border:none;cursor:pointer;font-weight:600}
.btn.ghost{background:#fff;color:var(--theme);border:1px solid var(--theme)}
.btn.gray{background:#f2f2f4;color:var(--ink2);border:none}
.btn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.btn.mini{height:32px;line-height:32px;font-size:13px;width:auto;padding:0 14px;display:inline-block;border-radius:16px}
.btn.sm{height:36px;line-height:36px;font-size:14px}
.btn[disabled]{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;background:#f2f3f5;color:var(--ink2);font-size:12px;margin:0 6px 6px 0}
.chip.on{background:rgba(7,193,96,.12);color:var(--theme);border:1px solid var(--theme)}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;background:#f2f3f5;color:var(--ink2);margin-right:6px}
.tag.g{background:rgba(7,193,96,.12);color:#06a552}
.tag.o{background:rgba(240,138,60,.14);color:#c96a15}
.tag.b{background:rgba(58,111,247,.12);color:#3A6FF7}
.tag.r{background:rgba(230,67,64,.12);color:#c93b39}
.tag.p{background:rgba(107,91,210,.12);color:#6B5BD2}
.avatar{border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;letter-spacing:1px}
.av-56{width:56px;height:56px;font-size:20px}
.av-72{width:72px;height:72px;font-size:26px;border-radius:14px}
.av-40{width:40px;height:40px;font-size:15px;border-radius:8px}
.av-28{width:28px;height:28px;font-size:12px;border-radius:6px}
.lock{filter:blur(6px);opacity:.55}
.badge{position:absolute;top:-4px;right:-6px;background:var(--danger);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;padding:0 4px;line-height:16px;text-align:center}
.rel{position:relative}
.divider{height:1px;background:var(--line);margin:12px 0}
.input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:15px;background:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:6px 10px;margin:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.search input{flex:1;border:none;outline:none;font-size:14px;background:transparent}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;white-space:nowrap}
.filters::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.timeline{position:relative;padding-left:18px;margin-top:6px}
.timeline:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:12px}
.tl-item:before{content:"";position:absolute;left:-18px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--theme)}
.tl-item .t{font-size:11px;color:var(--ink3)}
.switch{width:44px;height:26px;border-radius:13px;background:#dcdcdc;position:relative;transition:.2s;flex:0 0 auto;cursor:pointer}
.switch.on{background:var(--theme)}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on i{left:20px}
.switch.dis{opacity:.5}
body.hc{--ink:#000;--ink2:#1a1a1a;--ink3:#4a4a4a;--line:#c4c4c4}
body.hc .card,body.hc .card.tight,body.hc .chip,body.hc .tag{border:1px solid #b5b5b5}
body.hc .muted,body.hc .small{color:#4a4a4a}
body.hc .btn{font-weight:700}
.btn:active{opacity:.85}
.tab:active{opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border-radius:10px;padding:12px;text-align:center}
.stat .n{font-size:22px;font-weight:700;color:var(--theme)}
.stat .l{font-size:11px;color:var(--ink3);margin-top:2px}
.ph{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:12px;text-align:center;padding:6px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 12px 10px}
.card-h{width:230px;flex:0 0 auto;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.rec-why{margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--bg);color:var(--theme);font-size:12px;line-height:1.5}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice{background:#fff8e6;color:#8a5a00;font-size:12px;padding:10px 12px;margin:10px 12px;border-radius:8px;border-left:3px solid var(--warn)}
.notice.b{background:#eaf5ee;color:#0a6b34;border-left-color:var(--ok)}
.notice.r{background:#fdeeee;color:#a33a37;border-left-color:var(--danger)}
.notice.p{background:#f0edfb;color:#4b3fa0;border-left-color:var(--admin)}
.bar{height:6px;border-radius:3px;background:#eee;overflow:hidden}
.bar i{display:block;height:100%;background:var(--theme)}
.msg{max-width:76%;padding:9px 12px;border-radius:10px;font-size:14px;margin-bottom:10px;word-break:break-word}
.msg.in{background:#fff;align-self:flex-start}
.msg.out{background:var(--theme);color:#fff;align-self:flex-end}
#chat{display:flex;flex-direction:column;padding:14px}
.sys{align-self:center;background:#dcdcdc;color:#5a5a5a;font-size:11px;padding:4px 10px;border-radius:6px;margin-bottom:10px;max-width:86%;text-align:center}
/* ---------- 弹层 ---------- */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:50}
#modal.show{display:flex}
.sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;padding:18px 16px 26px;max-height:82%;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
#toast{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:99;display:none;max-width:80%;text-align:center}
/* ---------- 角色选择 ---------- */
.role{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:14px;margin:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;border:1px solid transparent}
.role:active,.card.tight:active{transform:scale(.985)}
.chip:active{opacity:.6}
.role .r-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.role .r-n{font-size:16px;font-weight:600}
.role .r-d{font-size:12px;color:var(--ink3);margin-top:2px}
.hero{padding:26px 20px 8px;color:#fff;background:var(--theme)}
.hero h1{margin:0;font-size:22px;font-weight:700}
.hero p{margin:6px 0 0;font-size:13px;opacity:.92}
.footer-note{text-align:center;color:#b0b0b0;font-size:11px;padding:14px 20px 20px}
a.lnk{color:var(--theme);text-decoration:none}

/* 推荐理由：与小程序的 feed 云函数同一套口径，改一边就要改另一边 */
function whyOf(a){
  const gap=Math.abs(a.grad-ME.grad);
  const same=(ME.tags||[]).filter(t=>(a.tags||[]).includes(t));
  if(a.city===ME.city) return gap?("同城 · "+a.city):("同城 · "+a.city+" · 同届");
  if(same.length) return "共同兴趣："+same[0];
  if(!gap) return "同届 · "+a.grad+" 届";
  return "届别相近 · 相差 "+gap+" 届";
}

     "staff:review":pgStaffReview,"staff:alumni":pgStaffAlumni,"staff:risk":pgStaffRisk,"staff:dash":pgStaffDash,"staff:me":pgStaffMe,
     "admin:home":pgAdminHome,"admin:perm":pgAdminPerm,"admin:data":pgAdminData,"admin:me":pgAdminLog
  }[key]||pgAlumHome)();
}
function goBack(){
  if(S.page==="login")return;
  if(S.page==="verify"){S.page="login";render();return;}
  if(S.page==="role"){const f=S.from;S.from=null;
    if(f==="me"&&S.role){S.page="main";S.tab="me";S.arg=null;render();}
    else if(f==="app"){S.page="login";render();}
    else {S.page="verify";render();}
    return;}
  if(S.page==="wechat"){S.page="main";S.tab="chat";S.arg=null;render();return;}
  if(S.page==="pchat"){S.page="main";S.tab="match";S.arg=null;render();return;}
  if(S.page==="chat"){S.page="main";S.tab="chat";S.arg=null;render();return;}
  if(S.page==="bbsDetail"||S.page==="bbsPost"){S.page="main";S.tab="bbs";render();return;}
  if(S.page==="pgroupMe"||S.page==="pgchat"){S.page="main";S.tab="pgroup";render();return;}
  if(["visitors","photoAuth","parentVis","invite","approval","tech","settings","import","intro"].includes(S.page)){S.page="main";render();return;}
  if(S.page!=="main"){S.page="main";render();return;}
  if(S.arg!=null){S.arg=null;render();return;}
  S.from="app";S.role=null;S.page="role";render();
}

      <div class="pg-bd-r"><span style="color:var(--danger)">✘</span><span style="flex:1">你的<b>孩子看不到</b>这些内容</span></div>
      <div class="pg-bd-r"><span style="color:var(--danger)">✘</span><span style="flex:1">校友看不到你的姓名，也看不到这三项</span></div>
      <div class="pg-bd-r"><span style="color:var(--danger)">✘</span><span style="flex:1">你的姓名不能在这里改 —— 它是绑定关系的凭证</span></div>
    </div>
  </div>
  <div style="margin:14px 12px"><span class="btn" onclick="pgSave()">保存</span></div>
  <div class="row" style="margin:0 12px"><span class="btn mini ghost" style="flex:1" onclick="S.page='main';S.tab='pgroup';render()">去家长圈看看 ›</span></div>
  <div class="footer-note">三项都可以不填 · 不填只是卡片上不显示，不会被拦</div>`;
}
function pgAdd(which,preset){
  const v=preset||(which==="resource"?window._pgRes:window._pgWant)||"";
  const s=v.trim(); if(!s) return toast("先写一条");
  const a=S.pgMine[which];
  if(a.indexOf(s)>=0) return toast("已经有了");
  if(a.length>=8) return toast("最多 8 条");
  a.push(s);
  if(!preset){window._pgRes="";window._pgWant="";}
  render();
}
function pgDel(which,v){
  const a=S.pgMine[which],i=a.indexOf(v);
  if(i>=0)a.splice(i,1);
  render();
}
function pgSave(){
  S.page="main";S.tab="pgroup";
  toast("已保存 · 家长圈里其他家长现在能看到你的三项了");
  render();
}
