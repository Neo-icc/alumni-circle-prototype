<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EDEDED">
<title>校友圈</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#EDEDED;color:#191919;-webkit-font-smoothing:antialiased;
  }

  /* ========== 桌面背景：手机居中 ========== */
  #desk{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#2c2f36;
  }
  #phone{
    position:relative;width:390px;height:844px;background:#EDEDED;
    overflow:hidden;display:flex;flex-direction:column;
  }
  @media (max-width:500px){
    #desk{background:#EDEDED}
    #phone{width:100%;height:100%;max-width:none}
  }

  /* ========== 状态栏 ========== */
  #statusbar{
    height:44px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 20px 6px;font-size:14px;font-weight:600;color:#191919;
    background:#EDEDED;position:relative;z-index:30;
  }
  #sb-time{letter-spacing:.3px;font-variant-numeric:tabular-nums}
  #sb-right{display:flex;align-items:center;gap:5px}
  #sb-right svg{display:block}

  /* ========== 导航栏（微信小程序样式） ========== */
  #navbar{
    height:44px;flex:0 0 auto;display:flex;align-items:center;padding:0 8px;
    background:#EDEDED;position:relative;z-index:30;
  }
  #nav-back{
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    border:0;background:transparent;cursor:pointer;color:#191919;border-radius:50%;
  }
  #nav-back:active{background:rgba(0,0,0,.06)}
  #nav-back[hidden]{visibility:hidden}
  #nav-title{
    flex:1;text-align:center;font-size:17px;font-weight:600;color:#191919;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;
  }
  #capsule{
    width:87px;height:32px;flex:0 0 auto;display:flex;align-items:center;
    background:rgba(255,255,255,.62);border-radius:16px;border:.5px solid rgba(0,0,0,.08);
  }
  #capsule .cap-btn{
    flex:1;display:flex;align-items:center;justify-content:center;color:#191919;
  }
  #capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}

  /* ========== 页面容器 ========== */
  #viewport{flex:1;position:relative;overflow:hidden;background:#EDEDED}
  #viewport iframe{
    width:100%;height:100%;border:0;display:block;background:#EDEDED;
  }
  @media (max-width:500px){iframe{border-radius:0}}

  /* ========== TabBar（首页/连接/我的） ========== */
  #tabbar{
    flex:0 0 auto;height:56px;background:#F7F7F7;display:flex;
    border-top:.5px solid #d9d9d9;padding-bottom:env(safe-area-inset-bottom);
    position:relative;z-index:30;
  }
  #tabbar[hidden]{display:none}
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;cursor:pointer;color:#8a8a8a;background:none;border:0;padding:0;
    font-family:inherit;
  }
  .tab.on{color:#07C160}
  .tab .lbl{font-size:10.5px;letter-spacing:.2px}
  .tab svg{width:23px;height:23px}

  /* ========== 提示浮层 ========== */
  #toast{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.78);color:#fff;padding:12px 20px;border-radius:8px;
    font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:opacity .22s;
    max-width:80%;text-align:center;line-height:1.6;
  }
  #toast.show{opacity:1}

  /* ========== 桌面端浮动身份切换 ========== */
  #roles{
    position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;
    display:none;gap:7px;background:rgba(0,0,0,.6);padding:7px 9px;border-radius:22px;
    backdrop-filter:blur(8px);
  }
  @media (min-width:501px){ #roles{display:flex} }
  .role{
    padding:6px 13px;border-radius:15px;font-size:12.5px;color:#fff;cursor:pointer;
    white-space:nowrap;user-select:none;transition:.15s;
  }
  .role.on{background:#07C160;font-weight:600}
</style>
</head>
<body>

<div id="desk">
  <div id="phone">
    <!-- 状态栏 -->
    <div id="statusbar">
      <span id="sb-time">9:41</span>
      <span id="sb-right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="#191919"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="#191919"><path d="M8 9.5l2.2-2.4a3.3 3.3 0 0 0-4.4 0L8 9.5z"/><path d="M3.6 5.1a6.6 6.6 0 0 1 8.8 0l-1.3 1.4a4.9 4.9 0 0 0-6.2 0L3.6 5.1z" opacity=".9"/><path d="M.8 2.1a10.6 10.6 0 0 1 14.4 0l-1.3 1.4a8.9 8.9 0 0 0-11.8 0L.8 2.1z" opacity=".9"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.2" fill="none" stroke="#191919" stroke-opacity=".38"/><rect x="2" y="2" width="18" height="8" rx="2" fill="#191919"/><path d="M23.2 4v4a2.1 2.1 0 0 0 0-4z" fill="#191919" fill-opacity=".38"/></svg>
      </span>
    </div>

    <!-- 导航栏 -->
    <div id="navbar">
      <button id="nav-back" hidden aria-label="返回">
        <svg width="11" height="19" viewBox="0 0 11 19" fill="none"><path d="M9.5 1.5L2 9.5l7.5 8" stroke="#191919" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="nav-title">校友圈</div>
      <div id="capsule">
        <span class="cap-btn"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6.6" stroke="#191919" stroke-width="1.3"/><path d="M9 5.6v3.6l2.4 1.5" stroke="#191919" stroke-width="1.3" stroke-linecap="round"/></svg></span>
        <span class="divider"></span>
        <span class="cap-btn"><svg width="18" height="18" viewBox="0 0 18 18" fill="#191919"><circle cx="9" cy="9" r="1.7"/><circle cx="3.2" cy="9" r="1.7"/><circle cx="14.8" cy="9" r="1.7"/></svg></span>
      </div>
    </div>

    <!-- 页面 -->
    <div id="viewport">
      <iframe id="vp" src="app.html" title="校友圈"></iframe>
    </div>

    <!-- TabBar -->
    <div id="tabbar" hidden>
      <button class="tab on" data-t="0"><svg viewBox="0 0 24 24" fill="none"><path d="M3.5 10.2L12 3.5l8.5 6.7V20a1 1 0 0 1-1 1h-4.6v-6.2H9.1V21H4.5a1 1 0 0 1-1-1v-9.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span class="lbl">校友</span></button>
      <button class="tab" data-t="1"><svg viewBox="0 0 24 24" fill="none"><circle cx="7.5" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="10" r="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M2.5 19.5c.6-3.1 2.6-4.7 5-4.7s4.4 1.6 5 4.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M15.4 15.2c2.8-.3 4.7 1 5.2 4.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span class="lbl">连接</span></button>
      <button class="tab" data-t="2"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.8" stroke="currentColor" stroke-width="1.7"/><path d="M4.6 20.2c.9-3.9 3.7-5.9 7.4-5.9s6.5 2 7.4 5.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span class="lbl">我的</span></button>
    </div>

    <!-- 桌面端身份切换 -->
    <div id="roles">
      <span class="role on" data-r="alum">校友</span>
      <span class="role" data-r="parent">家长</span>
      <span class="role" data-r="staff">教职工</span>
      <span class="role" data-r="admin">管理员</span>
    </div>

    <div id="toast"></div>
  </div>
</div>

<script>
(function(){
  var VP=document.getElementById('vp');
  var toast=document.getElementById('toast');
  var TITLES={alum:'校友圈',parent:'家长端',staff:'教职工端',admin:'管理端'};

  // 时间
  function tick(){
    var d=new Date();
    document.getElementById('sb-time').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  }
  tick();setInterval(tick,20000);

  function say(t){toast.textContent=t;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},1800)}

  // 身份切换
  document.querySelectorAll('.role').forEach(function(el){
    el.addEventListener('click',function(){
      document.querySelectorAll('.role').forEach(function(x){x.classList.remove('on')});
      el.classList.add('on');
      var r=el.dataset.r;
      document.getElementById('nav-title').textContent=TITLES[r];
      document.getElementById('tabbar').hidden=(r!=='alum');
      try{ VP.contentWindow.enter(r); }catch(e){ VP.contentWindow.location.reload(); }
    });
  });

  // 桌面端返回键（原型内部导航不可见，这里作为兜底提示）
  document.getElementById('nav-back').addEventListener('click',function(){
    say('在页面内滑动即可返回');
  });

  // TabBar 高亮
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
      t.classList.add('on');
      say('原型内滑动切换页面');
    });
  });
})();
</script>
</body>
</html>
