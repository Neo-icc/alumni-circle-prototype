<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EDEDED">
<title>ICC国际高中校友圈</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#2c2f36;color:#fff;-webkit-font-smoothing:antialiased;
  }

  /* ========== 桌面：手机居中 + 下方工具条 ========== */
  #desk{
    position:fixed;inset:0;overflow:auto;
    display:flex;align-items:center;justify-content:center;padding:18px 0;
  }
  #stage{display:flex;flex-direction:column;align-items:center;gap:12px}
  #phone{
    position:relative;width:390px;height:844px;flex:0 0 auto;background:#EDEDED;
    overflow:hidden;border-radius:40px;box-shadow:0 24px 70px rgba(0,0,0,.45);
    border:8px solid #1c1c1e;
  }
  #phone iframe{width:100%;height:100%;border:0;display:block;background:#EDEDED}
  @media (max-width:500px){
    body{background:#EDEDED}
    #desk{padding:0;display:block}
    #stage{gap:0}
    #phone{width:100vw;height:100vh;max-height:none;border-radius:0;border:none;box-shadow:none}
  }

  /* ========== 身份切换（桌面端显示） ========== */
  #roles{
    display:flex;gap:7px;background:rgba(0,0,0,.42);padding:7px 9px;border-radius:22px;
    backdrop-filter:blur(8px);flex-wrap:wrap;justify-content:center;
  }
  .role{
    padding:6px 13px;border-radius:15px;font-size:12.5px;color:#fff;cursor:pointer;
    white-space:nowrap;user-select:none;transition:.15s;
  }
  .role.on{background:#07C160;font-weight:600}
  @media (max-width:500px){ #roles{display:none} }
  #hint{
    font-size:11.5px;color:rgba(255,255,255,.5);text-align:center;line-height:1.7;
    max-width:420px;padding:0 16px;
  }
  @media (max-width:500px){ #hint{display:none} }
</style>
</head>
<body>

<div id="desk">
  <div id="stage">
    <div id="phone">
      <iframe id="vp" src="app.html" title="ICC国际高中校友圈"></iframe>
    </div>
    <div id="roles">
      <span class="role" data-r="alum">校友</span>
      <span class="role" data-r="parent">家长</span>
      <span class="role" data-r="staff">教职工</span>
      <span class="role" data-r="admin">管理员</span>
    </div>
    <div id="hint">
      点上面的身份直接切换视角 · 手机上看请竖屏，直接访问本页即可全屏
    </div>
  </div>
</div>

<script>
(function(){
  var VP=document.getElementById('vp');
  var TITLES={alum:'校友端',parent:'家长端',staff:'教职工端',admin:'管理端'};

  document.querySelectorAll('.role').forEach(function(el){
    el.addEventListener('click',function(){
      document.querySelectorAll('.role').forEach(function(x){x.classList.remove('on')});
      el.classList.add('on');
      var r=el.dataset.r;
      var w=VP.contentWindow;
      try{ w.enter(r); }catch(e){ VP.src='app.html'; }
    });
  });
})();
</script>
</body>
</html>
